name: Download and comprehensively export Surface Pro 7 MSI

on:
  workflow_dispatch:
    inputs:
      dropbox_url:
        description: "Paste the Dropbox shared MSI URL"
        required: true
        type: string

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pymsi
        run: python -m pip install --upgrade pip pymsi

      - name: Download MSI from Dropbox
        env:
          DROPBOX_URL: \${{ inputs.dropbox_url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import subprocess
          from urllib.parse import urlsplit, parse_qsl, urlencode, urlunsplit

          raw = os.environ["DROPBOX_URL"].strip()
          parts = urlsplit(raw)

          if parts.scheme != "https" or parts.netloc not in {"www.dropbox.com", "dropbox.com"}:
              raise SystemExit("The supplied URL must be an HTTPS Dropbox URL.")

          query = dict(parse_qsl(parts.query, keep_blank_values=True))
          query["dl"] = "1"
          direct_url = urlunsplit(
              (parts.scheme, parts.netloc, parts.path, urlencode(query), parts.fragment)
          )

          subprocess.run(
              [
                  "curl", "-L", "--fail", "--retry", "3", "--retry-delay", "2",
                  "-A", "Mozilla/5.0",
                  direct_url,
                  "-o", "SurfacePro7_Win11_22621_25.090.3489.0.msi",
              ],
              check=True,
          )
          PY

          file SurfacePro7_Win11_22621_25.090.3489.0.msi
          sha256sum SurfacePro7_Win11_22621_25.090.3489.0.msi | tee source.sha256

      - name: Export MSI with pymsi
        run: |
          rm -rf extracted
          python tools/export_msi.py \
            SurfacePro7_Win11_22621_25.090.3489.0.msi \
            extracted

      - name: Verify comprehensive export
        run: |
          set -euo pipefail
          test -f extracted/source/SurfacePro7_Win11_22621_25.090.3489.0.msi
          test -f extracted/metadata/manifest.json
          test -f extracted/metadata/ole-tree.txt
          test -d extracted/files
          test -d extracted/tables
          test -d extracted/streams
          test -d extracted/reports

          echo "=== Export inventory ==="
          find extracted -type f | sort
          echo
          echo "=== File count ==="
          find extracted -type f | wc -l
          echo
          echo "=== Largest files ==="
          find extracted -type f -printf '%s %p\n' | sort -nr | head -25

      - name: Configure Git LFS for large extracted binaries
        shell: bash
        run: |
          set -euo pipefail
          git lfs install

          # Track binary formats likely to occur in the driver payload and raw
          # MSI/OLE stream export. This keeps large installer assets out of
          # ordinary Git blobs.
          git lfs track "extracted/**/*.msi"
          git lfs track "extracted/**/*.cab"
          git lfs track "extracted/**/*.exe"
          git lfs track "extracted/**/*.dll"
          git lfs track "extracted/**/*.sys"
          git lfs track "extracted/**/*.cat"
          git lfs track "extracted/**/*.bin"

          # Also automatically track any other individual extracted file that
          # reaches 90 MiB, regardless of extension.
          while IFS= read -r -d '' file; do
            git lfs track "$file"
          done < <(find extracted -type f -size +90M -print0)

      - name: Commit extracted files into GFYMS repository
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage only the extraction tree and LFS rules generated by this run.
          git add .gitattributes extracted

          # Protect against accidentally committing unrelated working-tree changes.
          unexpected="$(git diff --cached --name-only | grep -Ev '^(\.gitattributes|extracted/)' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected staged paths:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
            exit 0
          fi

          git diff --cached --stat
          git commit -m "Add complete Surface Pro 7 MSI extraction"

          current_branch="$(git branch --show-current)"
          if [ -z "$current_branch" ]; then
            echo "Detached HEAD; refusing to push."
            exit 1
          fi

          git push origin "HEAD:$current_branch"

      - name: Build convenience ZIP
        run: |
          set -euo pipefail
          zip -r -9 \
            SurfacePro7_Win11_22621_25.090.3489.0-pymsi-complete.zip \
            extracted
          sha256sum \
            SurfacePro7_Win11_22621_25.090.3489.0-pymsi-complete.zip \
            > complete.zip.sha256

      - name: Upload convenience ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SurfacePro7-Win11-pymsi-complete
          path: |
            SurfacePro7_Win11_22621_25.090.3489.0-pymsi-complete.zip
            complete.zip.sha256
            source.sha256
          if-no-files-found: error
          retention-days: 30
