name: Import and extract Surface Pro 7 MSI
# Re-run the import workflow after exporter fixes.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pymsi-dropbox-complete.yml"
      - "tools/export_msi.py"
  workflow_dispatch:
    inputs:
      dropbox_url:
        description: "Paste the Dropbox shared MSI URL"
        required: true
        type: string

permissions:
  contents: write

env:
  DEFAULT_DROPBOX_URL: "https://www.dropbox.com/scl/fi/91i90qre9ryn1bn0trxrc/SurfacePro7_Win11_22621_25.090.3489.0.msi?rlkey=4ufuuvia7186ju1jpt8k1mhqj&st=4285o9zf&dl=0"
  MSI_NAME: "SurfacePro7_Win11_22621_25.090.3489.0.msi"

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pymsi
        run: python -m pip install --upgrade pip pymsi

      - name: Download MSI from Dropbox
        shell: bash
        env:
          INPUT_URL: ${{ inputs.dropbox_url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          import subprocess
          from urllib.parse import urlsplit, parse_qsl, urlencode, urlunsplit

          raw = os.environ.get("INPUT_URL", "").strip() or os.environ["DEFAULT_DROPBOX_URL"]
          parts = urlsplit(raw)
          if parts.scheme != "https" or parts.netloc not in {"www.dropbox.com", "dropbox.com"}:
              raise SystemExit("Input is not a valid Dropbox HTTPS URL.")

          query = dict(parse_qsl(parts.query, keep_blank_values=True))
          query["dl"] = "1"
          direct = urlunsplit((parts.scheme, parts.netloc, parts.path, urlencode(query), parts.fragment))

          subprocess.run([
              "curl", "-L", "--fail", "--retry", "4", "--retry-all-errors",
              "--retry-delay", "2", "-A", "Mozilla/5.0",
              direct, "-o", os.environ["MSI_NAME"]
          ], check=True)
          PY
          test -s "${MSI_NAME}"
          file "${MSI_NAME}"
          sha256sum "${MSI_NAME}" | tee source.sha256

      - name: Export MSI with pymsi
        run: |
          rm -rf extracted
          python tools/export_msi.py \
            SurfacePro7_Win11_22621_25.090.3489.0.msi \
            extracted

      - name: Verify comprehensive export
        run: |
          set -euo pipefail
          test -f extracted/source/SurfacePro7_Win11_22621_25.090.3489.0.msi
          test -f extracted/metadata/manifest.json
          test -f extracted/metadata/ole-tree.txt
          test -d extracted/files
          test -d extracted/tables
          test -d extracted/streams
          test -d extracted/reports

          echo "=== Export inventory ==="
          find extracted -type f | sort
          echo
          echo "=== File count ==="
          find extracted -type f | wc -l
          echo
          echo "=== Largest files ==="
          find extracted -type f -printf '%s %p\n' | sort -nr | head -25

      - name: Configure Git LFS for large extracted binaries
        shell: bash
        run: |
          set -euo pipefail
          git lfs install

          # Track binary formats likely to occur in the driver payload and raw
          # MSI/OLE stream export. This keeps large installer assets out of
          # ordinary Git blobs.
          git lfs track "extracted/**/*.msi"
          git lfs track "extracted/**/*.cab"
          git lfs track "extracted/**/*.exe"
          git lfs track "extracted/**/*.dll"
          git lfs track "extracted/**/*.sys"
          git lfs track "extracted/**/*.cat"
          git lfs track "extracted/**/*.bin"

          # Also automatically track any other individual extracted file that
          # reaches 90 MiB, regardless of extension.
          while IFS= read -r -d '' file; do
            git lfs track "$file"
          done < <(find extracted -type f -size +90M -print0)

      - name: Commit extracted tree to GFYMS
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .gitattributes extracted

          unexpected="$(git diff --cached --name-only | grep -Ev '^(.gitattributes|extracted/)' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected staged paths:"
            printf '%s\\n' "$unexpected"
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "No extraction changes to commit."
            exit 0
          fi

          git diff --cached --stat
          git commit -m "Add complete Surface Pro 7 MSI extraction"
          current_branch="$(git branch --show-current)"
          if [ "$current_branch" != "main" ]; then
            echo "Expected main, got $current_branch"
            exit 1
          fi
          git push origin HEAD:main

      - name: Build convenience ZIP
        run: |
          set -euo pipefail
          zip -r -9 \
            SurfacePro7_Win11_22621_25.090.3489.0-pymsi-complete.zip \
            extracted
          sha256sum \
            SurfacePro7_Win11_22621_25.090.3489.0-pymsi-complete.zip \
            > complete.zip.sha256

      - name: Upload convenience ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SurfacePro7-Win11-pymsi-complete
          path: |
            SurfacePro7_Win11_22621_25.090.3489.0-pymsi-complete.zip
            complete.zip.sha256
            source.sha256
          if-no-files-found: error
          retention-days: 30
