name: Build GFYMS Surface Pro 7 preview release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-gfyms-release.yml'
      - 'packages/gfyms-surface/**'
      - 'profiles/archiso-surface-pro-7/**'
      - 'tools/gfyms-patcher/**'
      - 'tools/gfyms-usb/**'
      - 'tools/build-gfyms-release.sh'
      - 'VERSION'
      - 'GFYMS_concept_logo-removebg-preview.png'

permissions:
  contents: write

concurrency:
  group: gfyms-surface-release-build-v2
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Build package and ISO in current Arch container
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(cat VERSION)
          rm -rf release-build
          mkdir -p release-build
          chmod 755 tools/build-gfyms-release.sh
          docker run --rm --privileged \
            -e VERSION="$VERSION" \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            archlinux:latest \
            /src/tools/build-gfyms-release.sh
          echo 'Built release artifacts:'
          ls -lh release-build
      - name: Run release sanity checks
        shell: bash
        run: |
          set -euo pipefail
          test -s release-build/SHA256SUMS
          test "$(find release-build -maxdepth 1 -name 'gfyms-surface-*.pkg.tar.zst' | wc -l)" -eq 1
          test "$(find release-build -maxdepth 1 -name 'gfyms-surface-pro-7-*.iso' | wc -l)" -eq 1
          test -s "$(find release-build -maxdepth 1 -name 'gfyms-arch-patcher-*.tar.gz' -print -quit)"
          test -s "$(find release-build -maxdepth 1 -name 'gfyms-usb-tool-*.tar.gz' -print -quit)"
          sha256sum -c release-build/SHA256SUMS

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GFYMS-Surface-Pro-7-preview-release
          path: release-build/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(cat VERSION)
          CURRENT_MAIN=$(git ls-remote origin refs/heads/main | awk "{print $1}")
          if [[ "$CURRENT_MAIN" != "$GITHUB_SHA" ]]; then
            echo "This workflow run is stale; current main is $CURRENT_MAIN, run is $GITHUB_SHA."
            exit 0
          fi
          TAG="v${VERSION}"
          RELEASE_FLAGS=()
          if [[ "$VERSION" == *-preview* || "$VERSION" == *-alpha* || "$VERSION" == *-beta* ]]; then RELEASE_FLAGS+=(--prerelease); fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" "${RELEASE_FLAGS[@]}" --title "GFYMS Surface Pro 7 ${VERSION}" --notes "GFYMS Surface Pro 7 preview build. This is an actual Arch + KDE Plasma image and native GFYMS packages, but it is not yet a claim of complete physical Surface qualification. See the hardware contract and known limitations in the repository." --target "$GITHUB_SHA"
          gh release upload "$TAG" release-build/* --clobber
