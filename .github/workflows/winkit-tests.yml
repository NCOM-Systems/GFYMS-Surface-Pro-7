name: WinKIT Tests

on:
  pull_request:
    branches: [feat/native-windows-runtime-foundation]
  push:
    branches: [feat/abi-map-v2]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test tooling
        run: python -m pip install --upgrade pytest

      - name: Compile WinKIT
        run: python -m compileall -q winkit tests

      - name: Run WinKIT tests
        run: python -m pytest
